---
version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  groups:
    github-actions:
      patterns:
      - "*"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker
  directory: "/acceptance/ssh_server"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker
  directory: "/acceptance"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker-compose
  directory: "/acceptance"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
- package-ecosystem: docker-compose
  directory: "/"
  schedule:
    interval: monthly
  cooldown:
    default-days: 45
